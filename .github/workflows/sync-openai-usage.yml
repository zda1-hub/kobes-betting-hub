name: Reconcile OpenAI usage

on:
  schedule:
    # GitHub cron is UTC. Arizona remains UTC-7 year-round: 03:15 MST.
    - cron: "15 10 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: openai-usage-reconciliation
  cancel-in-progress: false

jobs:
  reconcile:
    if: github.ref != 'refs/heads/codex/audit-membership-foundation'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      APP_ENV: production
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      OPENAI_ADMIN_KEY: ${{ secrets.OPENAI_ADMIN_KEY }}
      OPENAI_EXPECTED_PROJECT_ID: proj_8DxPJSInvFUVEZgs8KMld4rz
      OPENAI_EXPECTED_API_KEY_ID: key_TDES2zUP3W9UZaej
      OPENAI_USAGE_LOOKBACK_HOURS: "48"
    steps:
      - name: Check out the production source
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Import audited OpenAI usage and cost snapshots
        run: node scripts/sync-openai-usage.mjs

  one-time-production-backup:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/audit-membership-foundation'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXPECTED_PROJECT_REF: mpajyubbnnsdpgdizvht
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      PRODUCTION_DATABASE_URL: ${{ secrets.DATABASE_URL }}
      BACKUP_KEY: ${{ secrets.PRODUCTION_BACKUP_KEY }}
      PGCONNECT_TIMEOUT: "15"
    steps:
      - name: Validate required secrets and production target
        shell: bash
        run: |
          set -euo pipefail
          set +x
          test -n "${DATABASE_URL:-}" || { echo "DATABASE_URL is missing" >&2; exit 1; }
          test -n "${BACKUP_KEY:-}" || { echo "PRODUCTION_BACKUP_KEY is missing" >&2; exit 1; }
          case "$DATABASE_URL" in
            *"$EXPECTED_PROJECT_REF"*) ;;
            *) echo "Refusing backup: DATABASE_URL is not bound to the expected production project" >&2; exit 1 ;;
          esac
          case "$DATABASE_URL" in
            *"sslmode=require"*) ;;
            *) echo "Refusing backup: encrypted PostgreSQL transport is not required by DATABASE_URL" >&2; exit 1 ;;
          esac

      - name: Install PostgreSQL client
        shell: bash
        run: |
          docker pull postgres:17-alpine

      - name: Create, encrypt, and verify logical backup
        id: backup
        shell: bash
        run: |
          set -euo pipefail
          set +x
          umask 077
          mkdir -p artifacts
          created_at="$(date -u +%Y%m%dT%H%M%SZ)"
          plain="$(mktemp --tmpdir kbh-production-${created_at}.XXXXXX.dump)"
          encrypted="artifacts/kbh-production-${created_at}.dump.enc"
          restored="$(mktemp --tmpdir kbh-production-restore-check-${created_at}.XXXXXX.dump)"
          cleanup() {
            if command -v shred >/dev/null 2>&1; then
              shred -u "$plain" "$restored" 2>/dev/null || true
            else
              rm -f "$plain" "$restored"
            fi
          }
          trap cleanup EXIT

          kbh_pg_url="$(printf '%s' "$DATABASE_URL" | sed -E 's/([?&])uselibpqcompat=true(&?)/\1/; s/\?&/?/; s/[?&]$//')"
          docker run --rm --user "$(id -u):$(id -g)" \
            -e DATABASE_URL="$kbh_pg_url" \
            -v "$plain:/backup.dump" \
            postgres:17-alpine \
            sh -c 'pg_dump --dbname="$DATABASE_URL" --format=custom --no-owner --no-privileges --file=/backup.dump'
          docker run --rm -v "$plain:/backup.dump:ro" postgres:17-alpine pg_restore --list /backup.dump >/dev/null
          openssl enc -aes-256-cbc -salt -pbkdf2 -iter 600000 -md sha256 \
            -in "$plain" -out "$encrypted" -pass env:BACKUP_KEY
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 -md sha256 \
            -in "$encrypted" -out "$restored" -pass env:BACKUP_KEY
          docker run --rm -v "$restored:/backup.dump:ro" postgres:17-alpine pg_restore --list /backup.dump >/dev/null

          sha256sum "$encrypted" > "${encrypted}.sha256"
          cat > artifacts/README.txt <<EOF
          Kobe's Betting Hub encrypted production Supabase logical backup
          Project: ${EXPECTED_PROJECT_REF}
          Created (UTC): ${created_at}
          Format before encryption: PostgreSQL custom archive
          Encryption: AES-256-CBC, PBKDF2-HMAC-SHA256, 600000 iterations
          Verification: decrypted archive passed pg_restore --list
          Key location: GitHub Actions secret PRODUCTION_BACKUP_KEY and the operator's macOS Keychain
          EOF
          echo "created_at=$created_at" >> "$GITHUB_OUTPUT"

      - name: Upload encrypted backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: kbh-production-supabase-${{ steps.backup.outputs.created_at }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 14

      - name: Check out the reviewed source
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run the production migration plan without writes
        run: node pipeline/migrate-production.js --plan
