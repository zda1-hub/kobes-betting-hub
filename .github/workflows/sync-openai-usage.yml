name: Reconcile OpenAI usage

on:
  schedule:
    # GitHub cron is UTC. Arizona remains UTC-7 year-round: 03:15 MST.
    - cron: "15 10 * * *"
  workflow_dispatch:
    inputs:
      operation:
        description: Production-safe operation to run
        required: true
        default: reconcile
        type: choice
        options:
          - reconcile
          - encrypted-backup

permissions:
  contents: read

concurrency:
  group: openai-usage-reconciliation
  cancel-in-progress: false

jobs:
  reconcile:
    if: github.event_name == 'schedule' || inputs.operation == 'reconcile'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      APP_ENV: production
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      OPENAI_ADMIN_KEY: ${{ secrets.OPENAI_ADMIN_KEY }}
      OPENAI_EXPECTED_PROJECT_ID: proj_8DxPJSInvFUVEZgs8KMld4rz
      OPENAI_EXPECTED_API_KEY_ID: key_TDES2zUP3W9UZaej
      OPENAI_USAGE_LOOKBACK_HOURS: "48"
    steps:
      - name: Check out the production source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Import audited OpenAI usage and cost snapshots
        run: node scripts/sync-openai-usage.mjs

  encrypted-backup:
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'encrypted-backup'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      PRODUCTION_BACKUP_KEY: ${{ secrets.PRODUCTION_BACKUP_KEY }}
    steps:
      - name: Check out the approved release source
        uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes curl ca-certificates
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl --fail --output /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          . /etc/os-release
          printf 'Types: deb\nURIs: https://apt.postgresql.org/pub/repos/apt\nSuites: %s-pgdg\nComponents: main\nSigned-By: /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc\n' "$VERSION_CODENAME" | sudo tee /etc/apt/sources.list.d/pgdg.sources >/dev/null
          sudo apt-get update
          sudo apt-get install --yes postgresql-client-17
      - name: Create and verify encrypted production backup
        run: |
          export PATH="/usr/lib/postgresql/17/bin:$PATH"
          pg_dump --version | grep -E '^pg_dump \(PostgreSQL\) 17\.'
          PRODUCTION_BACKUP_DIR="$GITHUB_WORKSPACE/.production-backup" ./scripts/backup-production-supabase-ci.sh
      - name: Store encrypted backup temporarily
        uses: actions/upload-artifact@v4
        with:
          name: kbh-production-backup-${{ github.run_id }}
          path: .production-backup/
          if-no-files-found: error
          retention-days: 3
