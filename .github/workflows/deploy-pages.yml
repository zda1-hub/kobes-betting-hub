name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out site
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Prepare public site
        run: |
          mkdir _site
          cp index.html membership.html recaps.html recaps.js recaps-data.json faq.html support.html terms.html privacy.html responsible-gambling.html 404.html styles.css brand.css home.css home.js membership.css membership.js membership-theme.css robots.txt sitemap.xml betting-hub-logo.png betting-hub-logo-v2.png betting-hub-logo-final.png app.js _site/
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
