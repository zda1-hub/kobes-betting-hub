name: Production health (read-only)

on:
  schedule:
    # Five credential-free GET checks every 30 minutes. GitHub schedules use UTC.
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-health-read-only
  cancel-in-progress: false

jobs:
  smoke:
    name: Public endpoint smoke
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the production source
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Check public production endpoints
        run: node scripts/production-smoke.mjs
